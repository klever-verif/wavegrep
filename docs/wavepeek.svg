  <title
     id="title">WavePeek monochrome technical banner</title>
  <desc
     id="desc">A black-and-white vector banner with digital waveforms converging on a magnifying glass, alongside the WavePeek wordmark and tagline.</desc>
  <defs
     id="defs9">
    <style
       id="style4"><![CDATA[
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #24292f;
        --line: #24292f;
        --connector: #57606a;
        --separator: #d0d7de;
        --muted: #57606a;
        --dot: #d0d7de;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #f0f6fc;
          --line: #f0f6fc;
          --connector: #8b949e;
          --separator: #30363d;
          --muted: #8b949e;
          --dot: #30363d;
        }
      }

      .bg { fill: var(--bg); }
      .dot {
        fill: var(--dot);
        opacity: 0.55;
      }
      .wave, .bus, .lens, .crosshair {
        fill: none;
        stroke: var(--line);
        stroke-width: 2.15;
        stroke-linecap: square;
        stroke-linejoin: miter;
        vector-effect: non-scaling-stroke;
      }
      .connector {
        fill: none;
        stroke: var(--connector);
        stroke-width: 2.05;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 3 7;
        vector-effect: non-scaling-stroke;
      }
      .separator {
        fill: none;
        stroke: var(--separator);
        stroke-width: 1.8;
        stroke-dasharray: 8 7;
        vector-effect: non-scaling-stroke;
      }
      .label, .bus-text, .tagline, .mark, .micro {
        fill: var(--fg);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "DejaVu Sans Mono", "Courier New", monospace;
        font-variant-ligatures: none;
      }
      .label { font-size: 26px; font-weight: 400; }
      .bus-text { font-size: 23px; font-weight: 400; }
      .mark { font-size: 126px; font-weight: 400; letter-spacing: 4px; }
      .tagline { font-size: 31px; font-weight: 400; letter-spacing: 0.3px; }
      .micro { font-size: 16px; fill: var(--muted); letter-spacing: 1.5px; }
      .faint { opacity: 0.13; }
    ]]></style>
